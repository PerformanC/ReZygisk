<div class="panel nz">
  <div class="nz_header">
    <div>
      <div class="nz_header_title">{{title}}</div>
      <div id="modules_count" class="nz_header_sub">&nbsp;</div>
    </div>
    <button id="modules_refresh" class="nz_icon_btn" aria-label="Refresh"></button>
  </div>

  <label id="modules_search_box" class="nz_search" style="display: none;">
    <span id="modules_search_icon" style="display: contents;"></span>
    <input id="modules_search" type="search" autocomplete="off" spellcheck="false" placeholder="{{search}}">
  </label>

  <div class="nz" style="margin: 0 15px 12px;">
    <div id="modules_filter" class="nz_segmented" style="display: none;">
      <button data-filter="all" aria-pressed="true">{{filter.all}}</button>
      <button data-filter="working">{{filter.working}}</button>
      <button data-filter="issues">{{filter.issues}}</button>
    </div>
  </div>

  <div id="modules_list"></div>
</div>
